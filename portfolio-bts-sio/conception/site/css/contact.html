<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="images/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Contact - Portfolio AYMANE AYYADI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="animate__animated animate__fadeInDown">
        <a href="index.html" class="logo">AYMANE AYYADI</a>
        <nav class="navigation">
            <a href="index.html">Accueil</a>
            <a href="about.html">À propos</a>
            <a href="projects.html">Projets</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>  

    <section id="Contact" class="contact">
        <h2 class="title">Contactez-moi</h2>
        <div class="content">
            <div class="card animate__animated animate__fadeInLeft">
                <div class="icon">
                    <i class="fas fa-phone"></i>
                </div>
                <div class="info">
                    <h3>Téléphone</h3>
                    <p>+33 743349547</p>
                </div>
            </div>
            <div class="card animate__animated animate__fadeInRight">
                <div class="icon">
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="info">
                    <h3>Email</h3>
                    <p>aymane.ayyadi@hotmail.com</p>
                </div>
            </div>
        </div>
        <form class="contact-form animate__animated animate__fadeInUp">
            <input type="text" placeholder="Nom" required>
            <input type="email" placeholder="Email" required>
            <textarea placeholder="Votre message" rows="5" required></textarea>
            <button type="submit" class="btn">Envoyer</button>
        </form>
    </section>

    <footer class="footer">
        <p class="footer-title">©2025 Copyright <span>AYMANE AYYADI</span></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
